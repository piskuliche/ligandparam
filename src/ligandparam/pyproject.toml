[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ligandparam"
version = "1.6.1"
description = "Stage-based Amber ligand parameterization (Gaussian RESP, Leap, recipes)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Zeke Piskulich", email = "piskulichz@gmail.com"},
  {name = "Nate Levinzon", email = "ndlevinzon@gmail.com"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy<2",
  "pandas",
  "requests",
  "MDAnalysis>2.7.0",
  "parmed",
  "rdkit",
  "ase",
  "typing_extensions",
]

urls = { "Homepage" = "https://gitlab.com/RutgersLBSR/ligandparam" }

[project.optional-dependencies]
ml = [
  "deepmd-kit",
]
misc = [
  "openbabel",
]
sage = [
  "openff-toolkit",
]
docs = [
  "sphinx",
  "sphinx_rtd_theme",
]
all = [
  "ligandparam[ml]",
  "ligandparam[misc]",
  "ligandparam[sage]",
  "ligandparam[docs]",
]

[project.scripts]
lighfix = "ligandparam.cli.CliLigHFix:lighfix"
lig-getparam = "ligandparam.cli.LigGetParam:main"
smiles-to-pdb = "ligandparam.cli.SmilesToPdb:main"
lig-to-sage = "ligandparam.cli.Mol2ToSage:main"

# This directory is both the project root and the import package.
# `pip install -e src/ligandparam` (from the ALPS monorepo) or
# `pip install -e .` (from a standalone checkout of this folder).
[tool.setuptools]
package-dir = { "ligandparam" = "." }
packages = [
  "ligandparam",
  "ligandparam.cli",
  "ligandparam.io",
  "ligandparam.multiresp",
  "ligandparam.recipes",
  "ligandparam.runtime",
  "ligandparam.stages",
]

[tool.setuptools.package-data]
ligandparam = ["pkgdata/**/*"]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
skip-magic-trailing-comma = true
