stages:
  - test
  - publish

variables:
  UV_VERSION: "0.5"
  PYTHON_VERSION: "3.12"
  BASE_LAYER: bookworm-slim
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy
  UV_PUBLISH_USERNAME: "__token__"
  UV_PUBLISH_PASSWORD: "$UV_PUBLISH_PASSWORD_LIGANDPARAM"

pytest:
  stage: test
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  script:
    # A non-editable install so the tests exercise what actually ships: the console
    # script entry points and the declared dependencies, not the source tree.
    - uv pip install --system ".[test]"
    - python -m pytest tests/ -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

uv:
  stage: publish
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  # Publishing is gated on the test stage: 1.0.0 shipped with a console script that
  # could not start, which the smoke tests now catch.
  needs:
    - pytest
  script:
    - uv build
    - uv publish
  rules:
    - if: $CI_COMMIT_TAG
