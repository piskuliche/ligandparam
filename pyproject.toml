[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ligandparam"
version = "1.0.1"
description = "A ligand parameterization package for Amber"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Zeke Piskulich", email = "piskulichz@gmail.com"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]
dependencies = [
  "numpy<2",
  "requests",
  "MDAnalysis>2.7.0",
  "parmed",
  "rdkit",
  "ase",
  "typing_extensions"
]

urls = { "Homepage" = "https://gitlab.com/RutgersLBSR/ligandparam", "Documentation" = "https://ligandparam.readthedocs.io" }

[project.optional-dependencies]

ml = [
  "deepmd-kit",
  "tensorflow",
  "tblite",
  "mace-torch",
]

sage = [
  "openff-toolkit",
]

docs = [
  "sphinx",
  "sphinx_rtd_theme",
  "numpydoc",
]

test = [
  "pytest",
]

all = [
  "ligandparam[ml]",
  "ligandparam[sage]",
  "ligandparam[docs]",
]

[project.scripts]
lighfix = "ligandparam.cli.cli_lighfix:lighfix"
lig-getparam = "ligandparam.cli.ligandparam_getparam:main"
smiles-to-pdb = "ligandparam.cli.smiles_to_pdb:main"
lig-to-sage = "ligandparam.cli.mol2_to_sage:main"

# `namespaces = false` restricts discovery to real packages (those with an
# __init__.py). This keeps src/ligandparam/deprecated/ -- whose modules import
# pre-reorganisation paths and fail on import -- out of the built wheel.
[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
skip-magic-trailing-comma = true
